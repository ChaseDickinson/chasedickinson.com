name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels an older pull request run, but never a run that is applying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: python opentofu pre-commit shellcheck
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          # The hook only makes sense on a developer's machine, and CI runs on main.
          SKIP: no-commit-to-branch

  # Blocks a merge that would put a page with images the live site doesn't serve yet.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-images.sh

  plan:
    needs: pre-commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: opentofu
      - uses: ./.github/actions/aws
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
      - run: tofu init -input=false -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}"
      - run: tofu validate
      # The plan role is read-only, including on the state, so it plans without taking the lock.
      - name: Plan
        run: tofu plan -input=false -lock=false -no-color | tee "$RUNNER_TEMP/plan.txt"
      # Puts the plan on the run's summary page. Log masking may not apply to the summary,
      # so the account ID is replaced by hand before anything is written to it.
      - name: Show the plan in the job summary
        if: always()
        run: |
          [[ -f "$RUNNER_TEMP/plan.txt" ]] || exit 0
          account="$(aws sts get-caller-identity --query Account --output text)"
          {
            echo '## tofu plan'
            echo '```'
            tail -n 2000 "$RUNNER_TEMP/plan.txt" | sed "s/${account}/***/g"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: pre-commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: opentofu
      - uses: ./.github/actions/aws
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
      - run: tofu init -input=false -backend-config="bucket=${{ secrets.AWS_STATE_BUCKET }}"
      - run: tofu plan -input=false -out=tfplan
      - run: tofu apply -input=false tfplan

  deploy:
    needs: apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/aws
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
      # Images are uploaded by hand under content-hashed names by scripts/publish-images.sh, and
      # excluding images/ also stops --delete from touching them. The page and fonts get a short
      # cache time, so a change shows up within a minute and nothing needs an invalidation.
      - name: Sync the site
        run: |
          source scripts/lib.sh
          aws s3 sync site "s3://$(web_bucket)" --delete --exclude "images/*" \
            --cache-control "public, max-age=60"
